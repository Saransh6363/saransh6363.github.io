    <circle cx="150" cy="230" r="4"/><circle cx="170" cy="222" r="4"/><circle cx="190" cy="210" r="4"/>
    <circle cx="210" cy="205" r="4"/><circle cx="230" cy="190" r="4"/><circle cx="250" cy="182" r="4"/>
    <circle cx="270" cy="168" r="4"/><circle cx="290" cy="160" r="4"/><circle cx="310" cy="145" r="4"/>
    <circle cx="330" cy="138" r="4"/><circle cx="350" cy="122" r="4"/><circle cx="370" cy="112" r="4"/>
