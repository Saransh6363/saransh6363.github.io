  <text x="460" y="140" font-family="Courier New, monospace" font-size="44" fill="#34d399" font-weight="bold">0.717</text>
  <text x="460" y="164" font-family="Courier New, monospace" font-size="12" fill="#9aa0ac">PEARSON R</text>

  <line x1="460" y1="188" x2="740" y2="188" stroke="#20232e"/>

  <g font-family="Courier New, monospace" font-size="12" fill="#c7cbd4">
