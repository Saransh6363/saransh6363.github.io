<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="340" fill="#090a0f"/>
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1b3a4a"/>
      <stop offset="100%" stop-color="#5ec8f8"/>
    </linearGradient>
  </defs>

  <!-- query panel -->
  <rect x="40" y="36" width="360" height="268" rx="10" fill="#10121a" stroke="#20232e"/>
  <text x="60" y="66" font-family="Courier New, monospace" font-size="12" fill="#9aa0ac">query.sql</text>
  <text x="60" y="98" font-family="Courier New, monospace" font-size="13" fill="#eab308">SELECT</text>
  <text x="118" y="98" font-family="Courier New, monospace" font-size="13" fill="#c7cbd4">city, category,</text>
  <text x="76" y="118" font-family="Courier New, monospace" font-size="13" fill="#c7cbd4">SUM(freight_value) AS freight</text>
  <text x="60" y="140" font-family="Courier New, monospace" font-size="13" fill="#eab308">FROM</text>
  <text x="108" y="140" font-family="Courier New, monospace" font-size="13" fill="#c7cbd4">orders o</text>
  <text x="60" y="162" font-family="Courier New, monospace" font-size="13" fill="#eab308">JOIN</text>
  <text x="104" y="162" font-family="Courier New, monospace" font-size="13" fill="#c7cbd4">order_items i USING(order_id)</text>
  <text x="60" y="184" font-family="Courier New, monospace" font-size="13" fill="#eab308">GROUP BY</text>
  <text x="140" y="184" font-family="Courier New, monospace" font-size="13" fill="#c7cbd4">city, category</text>
  <text x="60" y="206" font-family="Courier New, monospace" font-size="13" fill="#eab308">ORDER BY</text>
  <text x="140" y="206" font-family="Courier New, monospace" font-size="13" fill="#c7cbd4">freight DESC;</text>

  <line x1="60" y1="228" x2="380" y2="228" stroke="#20232e"/>
  <text x="60" y="252" font-family="Courier New, monospace" font-size="12" fill="#34d399">→ 5 tables joined</text>
  <text x="60" y="272" font-family="Courier New, monospace" font-size="12" fill="#34d399">→ 447,000+ rows scanned</text>
  <text x="60" y="292" font-family="Courier New, monospace" font-size="12" fill="#34d399">→ 16.57% avg freight ratio</text>

  <!-- bar chart panel -->
  <rect x="420" y="36" width="340" height="268" rx="10" fill="#10121a" stroke="#20232e"/>
  <text x="440" y="66" font-family="Courier New, monospace" font-size="12" fill="#9aa0ac">freight_by_category</text>

  <g>
    <rect x="450" y="230" width="34" height="50" fill="url(#bar)"/>
    <rect x="500" y="200" width="34" height="80" fill="url(#bar)"/>
    <rect x="550" y="150" width="34" height="130" fill="url(#bar)"/>
    <rect x="600" y="180" width="34" height="100" fill="url(#bar)"/>
    <rect x="650" y="210" width="34" height="70" fill="url(#bar)"/>
    <rect x="700" y="240" width="34" height="40" fill="url(#bar)"/>
  </g>
  <line x1="440" y1="280" x2="750" y2="280" stroke="#20232e"/>

  <circle cx="700" cy="130" r="46" fill="none" stroke="#34d399" stroke-width="3"/>
  <text x="700" y="126" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#34d399" font-weight="bold">0.72</text>
  <text x="700" y="142" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#9aa0ac">corr</text>
</svg>
