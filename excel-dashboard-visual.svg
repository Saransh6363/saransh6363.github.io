<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="340" fill="#090a0f"/>

  <!-- KPI cards row -->
  <g font-family="Courier New, monospace">
    <rect x="40" y="36" width="170" height="90" rx="10" fill="#10121a" stroke="#20232e"/>
    <text x="60" y="70" font-size="24" fill="#5ec8f8" font-weight="bold">₹130.6M</text>
    <text x="60" y="96" font-size="11" fill="#9aa0ac">TOTAL SALES</text>

    <rect x="222" y="36" width="170" height="90" rx="10" fill="#10121a" stroke="#20232e"/>
    <text x="242" y="70" font-size="24" fill="#34d399" font-weight="bold">73</text>
    <text x="242" y="96" font-size="11" fill="#9aa0ac">CATEGORIES</text>

    <rect x="404" y="36" width="170" height="90" rx="10" fill="#10121a" stroke="#20232e"/>
    <text x="424" y="70" font-size="24" fill="#eab308" font-weight="bold">16.57%</text>
    <text x="424" y="96" font-size="11" fill="#9aa0ac">FREIGHT RATIO</text>

    <rect x="586" y="36" width="174" height="90" rx="10" fill="#10121a" stroke="#20232e"/>
    <text x="606" y="70" font-size="24" fill="#5ec8f8" font-weight="bold">5</text>
    <text x="606" y="96" font-size="11" fill="#9aa0ac">TABLES MODELED</text>
  </g>

  <!-- pivot table panel -->
  <rect x="40" y="150" width="360" height="154" rx="10" fill="#10121a" stroke="#20232e"/>
  <text x="60" y="176" font-family="Courier New, monospace" font-size="12" fill="#9aa0ac">PIVOT / REGION x REVENUE</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#c7cbd4">
    <text x="60" y="202">Delhi</text><text x="330" y="202" text-anchor="end" fill="#5ec8f8">204M</text>
    <text x="60" y="224">Mumbai</text><text x="330" y="224" text-anchor="end">127M</text>
    <text x="60" y="246">Bangalore</text><text x="330" y="246" text-anchor="end">27M</text>
    <text x="60" y="268">Chennai</text><text x="330" y="268" text-anchor="end">26M</text>
  </g>
  <line x1="60" y1="188" x2="360" y2="188" stroke="#20232e"/>

  <!-- donut / slicer panel -->
  <rect x="420" y="150" width="340" height="154" rx="10" fill="#10121a" stroke="#20232e"/>
  <text x="440" y="176" font-family="Courier New, monospace" font-size="12" fill="#9aa0ac">SLICER / CATEGORY MIX</text>

  <g transform="translate(500,230)">
    <circle r="46" fill="none" stroke="#20232e" stroke-width="18"/>
    <circle r="46" fill="none" stroke="#5ec8f8" stroke-width="18" stroke-dasharray="130 300" stroke-dashoffset="0"/>
    <circle r="46" fill="none" stroke="#34d399" stroke-width="18" stroke-dasharray="80 300" stroke-dashoffset="-130"/>
    <circle r="46" fill="none" stroke="#eab308" stroke-width="18" stroke-dasharray="60 300" stroke-dashoffset="-210"/>
  </g>
  <g font-family="Courier New, monospace" font-size="11" fill="#9aa0ac">
    <rect x="600" y="205" width="9" height="9" fill="#5ec8f8"/><text x="614" y="214">Electronics</text>
    <rect x="600" y="228" width="9" height="9" fill="#34d399"/><text x="614" y="237">Home &amp; Living</text>
    <rect x="600" y="251" width="9" height="9" fill="#eab308"/><text x="614" y="260">Other</text>
  </g>
</svg>
